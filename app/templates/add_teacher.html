{% extends "base.html" %} {% block title %}Add Teacher{% endblock %}

{% block content %}


<div class="container">
    <h3 align="center">Add New Teacher</h3>

    <form action="{{url_for('admin.add_teacher') }}" method="POST">
        <div class="form-group">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text"
                    class="form-control"
                    id="full_name"
                    name="full_name"
                    placeholder="Mr. Mike Bennet"
                    required
                    minlength="3"
                    pattern="[A-Za-z\s\-]+"
            >

            <label for="email" class="form-label">Email</label>
            <input type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="teacher1@school.org.uk"
                    required
            >

            <label for="department" class="form-label">Department</label>
            <input type="text"
                    class="form-control"
                    id="department"
                    name="department"
                    placeholder="e.g. Humanities"
                    required
            >

            <label for="subject" class="form-label">Subjects</label>
            <textarea class="form-control"
                    id="subject"
                    name="subject"
                    placeholder="e.g Maths, Physics, Biology"
                    rows="3"
            ></textarea>

            <button class="btn btn-primary" type="submit">Add new teacher</button>
        </div>
    </form>
</div>


{% endblock %}
